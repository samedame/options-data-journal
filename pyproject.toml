[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "options-data-journal"
version = "0.1.0"
description = "Option-chain snapshotter + fill/slippage/edge-survival journal (alert-only bots, manual execution)"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
odj = "odj.cli:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
odj = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "RUF012", "SIM105", "SIM108", "SIM115", "SIM102", "B905"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = []
warn_unused_ignores = false
# The vendored single-file bot client is deliberately untyped-friendly
[[tool.mypy.overrides]]
module = ["yfinance", "yfinance.*", "pandas_market_calendars", "pandas_market_calendars.*", "scipy", "scipy.*"]
ignore_missing_imports = true

# client.py is copied verbatim into other repos that may run older Pythons: keep it portable (3.8+ syntax).
[tool.ruff.lint.per-file-ignores]
"src/odj/journal/client.py" = ["UP"]
