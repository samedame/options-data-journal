name: weekly-report

# Sunday evening New York time. Scheduled at both UTC offsets; the script only proceeds inside the
# guarded window (Sunday 19:00-01:00 ET) and is a no-op if this week's report already exists.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate even if this week's report exists, and ignore the time window"
        type: boolean
        default: false
      mark_mode:
        description: "mid | conservative"
        required: false
        default: mid
  schedule:
    - cron: "0 23 * * 0" # Sun 19:00 EDT / 18:00 EST
    - cron: "0 0 * * 1" # Sun 20:00 EDT / 19:00 EST

permissions:
  contents: write

concurrency:
  group: odj-weekly-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e . --no-deps
      - name: Build the report
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          IN_FORCE: ${{ inputs.force }}
          IN_MARK_MODE: ${{ inputs.mark_mode }}
        run: |
          args=(--weekly --mark-mode "${IN_MARK_MODE:-mid}")
          if [ "${IN_FORCE}" = "true" ]; then args+=(--force); else args+=(--require-window); fi
          python -m odj report "${args[@]}"
      - name: Commit and push
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ODJ_GIT_NAME: github-actions[bot]
          ODJ_GIT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: python -m odj ci publish --message "weekly report ${GITHUB_RUN_ID} [skip ci]"
